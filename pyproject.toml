[project]
name = "massive-strategy-manager"
version = "1.0.0"
description = "Stock strategy manager: backtester, optimizer, scanner, and trader"
requires-python = ">=3.10"
dependencies = [
    "massive>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
massive-sm = "massive_sm.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
